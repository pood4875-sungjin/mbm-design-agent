<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 디자인 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="fui/ui3.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="ui3">
<!-- 피그마 UI3 문법의 실제 편집기: 탭스트립 › [레일 + 패널 | 캔버스(룰러 · 안내선 · 간격) | 편집 패널]. 문서는 이 브라우저(localStorage)에 저장 -->
<header class="tabstrip" id="tabstrip">
  <button class="tab-home" id="homeTab" aria-label="홈" title="홈"></button>
  <div class="tabs" id="tabs" role="tablist" aria-label="작업 탭"></div>
  <button class="tab-new" id="newTab" aria-label="새 탭" title="새 탭"></button>
  <div class="grow"></div>
  <div class="tab-right"><button class="tabbtn" id="easyBtn" title="왼쪽 입력 · 가운데 결과 · 오른쪽 편집의 작업 화면">작업 화면으로</button><button class="tabbtn" id="historyBtn" aria-haspopup="menu">작업 내역</button><button class="tabbtn" id="settingsBtn" aria-haspopup="menu">설정</button></div>
</header>
<main id="views"></main>
<div class="pop menu" id="pop" role="menu" hidden></div>
<div class="spop menu" id="spop" hidden></div>
<div class="dim" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" id="modalBox"></div></div>
<div class="toast bell" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
