<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 디자인 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<header class="gnb">
  <nav class="tabs" role="tablist" aria-label="작업 탭">
    <button class="tab-home" id="homeTab" role="tab" aria-selected="true" aria-label="홈" title="홈">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
    </button>
    <div class="tab-list" id="tabList"></div>
    <button class="tab-new" id="newTab" aria-label="새 탭" title="새 탭">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </nav>
  <div class="gnb-util">
    <button class="gnb-btn" id="historyBtn" aria-haspopup="dialog" aria-expanded="false">작업 내역</button>
    <button class="gnb-btn" id="settingsBtn" aria-haspopup="dialog" aria-expanded="false">설정</button>
  </div>
</header>

<main id="views">
  <section class="view view-home" id="homeView" role="tabpanel" aria-labelledby="homeTab"></section>
</main>

<div class="pop" id="historyPop" role="dialog" aria-label="작업 내역" hidden></div>
<div class="pop" id="settingsPop" role="dialog" aria-label="설정" hidden></div>
<div class="modal-dim" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><p id="modalBody"></p><div class="modal-act"><button class="btn pri" id="modalOk">확인</button></div></div></div>

<script type="module" src="hub.js"></script>
</body>
</html>
