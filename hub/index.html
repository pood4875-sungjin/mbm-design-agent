<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 디자인 스튜디오 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="fui/ui2.css">
<link rel="stylesheet" href="mock.css">
</head>
<body class="f-root">
<!-- 목업: 피그마 UI2 키트(컨시어지 파일 「ui」 페이지)의 컴포넌트로 홈 → 광고 소재 흐름만. 실제 도구와 연결하지 않는다.
     탭스트립(38 · #222) › 툴바(40 · #2C2C2C) › 사이드바 240 | 캔버스 Silver | 사이드바 240 -->
<header class="f-tabstrip" id="tabstrip">
  <div class="f-tl" aria-hidden="true"><i></i><i></i><i></i></div>
  <button class="f-tab-home" id="homeTab" aria-label="홈" title="홈"></button>
  <div class="f-tabs" id="tabs" role="tablist" aria-label="작업 탭"></div>
  <button class="f-tab-new" id="newTab" aria-label="새 탭" title="새 탭"></button>
  <div class="grow"></div>
  <button class="tabbtn" id="historyBtn" aria-haspopup="menu" aria-expanded="false">작업 내역</button>
  <button class="tabbtn" id="settingsBtn" aria-haspopup="menu" aria-expanded="false">설정</button>
</header>
<main id="views"></main>
<div class="pop f-menu" id="pop" role="menu" hidden></div>
<div class="dim" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" id="modalBox"></div></div>
<div class="toast f-bell" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="mock.js"></script>
</body>
</html>
