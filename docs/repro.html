<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레퍼런스 재현 검사 — Campaign Agent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 로컬 전용 페이지. 보드 레퍼런스(실제 고객사 소재)의 글자·색·이미지를 그대로 넣어 우리 렌더러가 같은 그림을 내는지 본다.
     원본 기록: ref/learned/user13/repro.json (gitignore) */
  :root{ --ink:#1a1a1a; --sub:#666; --line:#e5e5e5; --bg:#fff; --soft:#f7f7f6; --good:#1d7a4f; --good-soft:#e9f5ee; --bad:#b3261e; --bad-soft:#fbe9e7; --warn:#b07d10; --warn-soft:#fbf3df }
  @media (prefers-color-scheme:dark){ :root{ --ink:#ececec; --sub:#9a9a9a; --line:#2e2e2e; --bg:#161616; --soft:#1f1f1f; --good:#7ecfa2; --good-soft:#17281d; --bad:#f08c86; --bad-soft:#301a18; --warn:#d9a441; --warn-soft:#2c2412 } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Kakao Small Sans","카카오 작은글씨","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Kakao Big Sans","카카오 큰글씨","Kakao Small Sans","Pretendard",sans-serif}
  .wrap{max-width:1360px;margin:0 auto;padding:40px 24px 96px}
  h1{font-size:28px;margin:0 0 6px}
  .src{color:var(--sub);font-size:13px}
  .ctl{display:flex;gap:16px;align-items:center;margin:20px 0 8px;position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);z-index:2;flex-wrap:wrap}
  .ctl label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
  .item{border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px;background:var(--bg)}
  .ihead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:12px}
  .ihead h2{font-size:18px;margin:0}
  .ihead .meta{color:var(--sub);font-size:13px}
  .ihead a{font-size:12px;color:var(--sub)}
  .badge{font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
  .badge.good{background:var(--good-soft);color:var(--good);border-color:transparent} .badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent} .badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .panes{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .pane h4{font-size:12px;color:var(--sub);font-weight:700;margin:0 0 6px}
  .box{position:relative;overflow:hidden;outline:1px solid var(--line);background:#fff}
  .box iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none}
  .box img{position:absolute;left:0;top:0;display:block}
  .box.ov iframe{opacity:var(--ov,.5)}
  .txt{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13px;margin-top:14px;max-width:900px}
  .txt h4{font-size:12px;color:var(--sub);margin:0 0 4px}
  .txt ul{margin:0;padding-left:16px} .txt li{margin:1px 0} .txt li.miss{color:var(--bad)} .txt li.extra{color:var(--warn)}
  .note{font-size:12.5px;color:var(--sub);margin-top:10px}
  /* 레퍼런스 글자 상자(피그마 메타데이터)를 우리 결과 위에 빨간 선으로 — 줄 가운데가 얼마나 어긋나는지 본다 */
  .guide{position:absolute;left:0;right:0;border-top:1px solid rgba(220,40,40,.85);pointer-events:none}
  .guide.logo{border:1px solid rgba(220,40,40,.85);border-radius:2px}
  .dl{font-size:12px;margin-top:12px;border-collapse:collapse} .dl th,.dl td{padding:3px 10px 3px 0;text-align:left;border-bottom:1px solid var(--line)} .dl th{color:var(--sub);font-weight:600}
  .dl td.ok{color:var(--good)} .dl td.off{color:var(--bad)}
  .sum{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .sum .tile{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--soft);font-size:13px} .sum b{display:block;font-size:22px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>레퍼런스 재현 검사</h1>
  <p class="src">보드 레퍼런스 11장의 글자·배경색·로고·오브젝트 이미지를 그대로 넣고 우리 렌더러가 같은 그림을 내는지 본다. 왼쪽이 우리 결과, 가운데가 레퍼런스, 오른쪽은 둘을 겹친 것(슬라이더로 투명도). 아래 글자 목록은 레퍼런스에 있는데 우리 결과에 없는 줄을 빨갛게 표시한다.</p>
  <div class="sum" id="sum"></div>
  <div class="ctl">
    <label>겹쳐 보기 투명도 <input type="range" id="ov" min="0" max="100" value="50"> <span id="ovv">50%</span></label>
    <label><input type="checkbox" id="noKv"> 이미지 없이 그리기</label>
    <label><input type="checkbox" id="noLogo"> 로고 없이 그리기</label>
  </div>
  <main id="main"></main>
</div>
<script type="module">
  import { renderArtifact } from '../core/contract.js';
  import { registerAll } from '../core/generate.js';
  registerAll();   // 렌더러·매체 규격을 계약에 올린다 — 앱이 시작할 때 하는 일
  import { createContext } from '../core/context.js';
  import { normalizeStyle } from '../core/style.js';
  import { fieldFromImage, extractPalette, edgeColor } from '../core/palette.js';
  import { FONTS } from '../core/fonts.js';
  import { specOf } from '../core/media.js';

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const BASE = new URL('../ref/learned/user13/', location.href).href;
  const data = await (await fetch(BASE + 'repro.json', { cache: 'no-store' })).json();

  const loadImg = async src => { const img = new Image(); img.src = src; await img.decode(); return img; };
  // 앱의 analyzeKeyVisual과 같은 측정 — 지면색·가장자리·대표색을 이미지에서 읽는다
  async function kvMetaOf(img) {
    const W = 240, H = Math.max(1, Math.round(W * img.height / img.width));
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, W, H);
    const { data } = g.getImageData(0, 0, W, H);
    return { ar: img.width / img.height, edge: edgeColor(data, W, H), px: [img.width, img.height], field: fieldFromImage(data, W, H), colors: extractPalette(data, 3) };
  }
  const lum = hex => { const n = parseInt(hex.slice(1), 16); return (0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255; };
  const docOf = html => `<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="${FONTS.Pretendard.css}"><style>html,body{margin:0;background:transparent}</style></head><body>${html}</body></html>`;
  // 비교용 정규화 — 공백·구분 기호·단어 결합자(U+2060, 렌더러가 "신입/경력" 안에 끼운다)는 뺀다
  const norm = s => String(s).replace(/[\s⁠]+/g, '').replace(/[|:–\-~]/g, '');

  const opts = { noKv: false, noLogo: false };
  async function renderItem(it) {
    const spec = specOf(it.specId);
    const kvUrl = it.kv && !opts.noKv ? BASE + it.kv : null;
    const logoUrl = it.logo && !opts.noLogo ? BASE + it.logo : null;
    const kvMeta = kvUrl ? await kvMetaOf(await loadImg(kvUrl)) : null;
    const dark = lum(it.bg) < 0.5;
    const style = normalizeStyle({
      colors: [it.bg], keyVisual: kvUrl, kvMeta, logo: logoUrl,
      logoLight: dark ? logoUrl : null,           // 레퍼런스 로고는 이미 지면에 맞는 색 — 어두운 지면이라고 반전하지 않는다
      background: { mode: 'solid', color: it.bg },
    });
    const ctx = createContext(it.fields, 'recruit');
    const html = renderArtifact(it.specId, ctx, style);
    const dom = new DOMParser().parseFromString(html, 'text/html');
    const lines = [...dom.querySelectorAll('[data-field]')].flatMap(el => el.innerHTML.split(/<br\s*\/?>|<div>|<\/div>/).map(s => s.replace(/<[^>]+>/g, '').trim()).filter(Boolean));
    return { spec, html, lines };
  }

  // 우리 결과의 글자 줄 상자 — iframe 문서에서 data-field마다 Range로 줄 사각형을 모은다(같은 출처라 읽을 수 있다)
  function measureLines(iframe) {
    const doc = iframe.contentDocument; if (!doc?.body) return [];
    const out = [];
    for (const el of doc.querySelectorAll('[data-field]')) {
      const role = el.dataset.field;
      // 글자 노드만 잰다 — 요소 상자를 섞으면 두 줄짜리 상세 칸이 한 덩어리로 잡힌다
      const walker = doc.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const rows = new Map();
      for (let n = walker.nextNode(); n; n = walker.nextNode()) {
        if (!n.textContent.trim()) continue;
        const r = doc.createRange(); r.selectNodeContents(n);
        for (const rc of r.getClientRects()) { if (rc.width < 2 || rc.height < 2) continue; const k = Math.round(rc.top / 6) * 6; const cur = rows.get(k); rows.set(k, cur ? { top: Math.min(cur.top, rc.top), bottom: Math.max(cur.bottom, rc.bottom) } : { top: rc.top, bottom: rc.bottom }); }
      }
      for (const [, v] of [...rows].sort((a, b) => a[0] - b[0])) out.push({ role: role === 'date' ? 'detail' : role, top: v.top, h: v.bottom - v.top });
    }
    const logo = doc.querySelector('[data-logo]'); if (logo) { const b = logo.getBoundingClientRect(); out.push({ role: 'logo', top: b.top, h: b.height, left: b.left, w: b.width }); }
    return out;
  }
  // 레퍼런스 줄과 우리 줄을 역할 순서대로 짝지어 가운데 차이를 적는다
  function deltaTable(it, ours) {
    if (!it.refLines) return '';
    const byRole = r => ours.filter(o => o.role === r);
    const used = {};
    const rows = it.refLines.map(([role, y, h]) => {
      const i = used[role] = (used[role] ?? 0); used[role]++;
      const o = byRole(role)[i];
      const refC = y + h / 2, ourC = o ? o.top + o.h / 2 : null;
      const d = ourC == null ? null : Math.round(ourC - refC);
      return `<tr><td>${esc(role)}</td><td>${Math.round(y)}~${Math.round(y + h)}</td><td>${o ? `${Math.round(o.top)}~${Math.round(o.top + o.h)}` : '(없음)'}</td><td class="${d == null ? '' : Math.abs(d) <= 6 ? 'ok' : 'off'}">${d == null ? '' : (d > 0 ? '+' : '') + d}px</td></tr>`;
    });
    const lg = ours.find(o => o.role === 'logo');
    if (it.refLogo && lg) { const [x, y, w, h] = it.refLogo; rows.push(`<tr><td>logo</td><td>${x},${y} ${w}×${h}</td><td>${Math.round(lg.left)},${Math.round(lg.top)} ${Math.round(lg.w)}×${Math.round(lg.h)}</td><td class="${Math.abs(lg.top + lg.h / 2 - (y + h / 2)) <= 6 && Math.abs(lg.left - x) <= 10 ? 'ok' : 'off'}">${Math.round(lg.top + lg.h / 2 - (y + h / 2)) > 0 ? '+' : ''}${Math.round(lg.top + lg.h / 2 - (y + h / 2))}px</td></tr>`); }
    return `<table class="dl"><thead><tr><th>줄</th><th>레퍼런스 y</th><th>우리 y</th><th>가운데 차이</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
  }
  const guidesHtml = (it, s) => !it.refLines ? '' : it.refLines.map(([role, y, h]) => `<div class="guide" style="top:${Math.round(y * s)}px;height:${Math.round(h * s)}px;border-bottom:1px solid rgba(220,40,40,.5)"></div>`).join('')
    + (it.refLogo ? `<div class="guide logo" style="left:${Math.round(it.refLogo[0] * s)}px;top:${Math.round(it.refLogo[1] * s)}px;width:${Math.round(it.refLogo[2] * s)}px;height:${Math.round(it.refLogo[3] * s)}px;right:auto"></div>` : '');

  function paneHtml(label, w, h, s, inner, cls = '') {
    return `<div class="pane"><h4>${esc(label)}</h4><div class="box ${cls}" style="width:${Math.round(w * s)}px;height:${Math.round(h * s)}px">${inner}</div></div>`;
  }
  function itemHtml(it, r) {
    const { w, h } = r.spec;
    const s = Math.min(w > h ? 640 / w : 300 / w, 520 / h);
    const refImg = `<img src="${BASE + it.ref}" alt="" style="width:${Math.round(w * s)}px;height:${Math.round(h * s)}px">`;
    const ours = `<iframe style="width:${w}px;height:${h}px;transform:scale(${s})" srcdoc="${esc(docOf(r.html))}"></iframe>`;
    const refLines = it.refText ?? [];
    const ourNorm = norm(r.lines.join(' '));
    const miss = refLines.filter(t => !ourNorm.includes(norm(t)));
    const refNorm = norm(refLines.join(' '));
    const extra = r.lines.filter(t => !refNorm.includes(norm(t)));
    const badge = miss.length === 0 ? '<span class="badge good">글자 전부 있음</span>' : `<span class="badge ${miss.length > 2 ? 'bad' : 'warn'}">레퍼런스 글자 ${miss.length}줄 빠짐</span>`;
    return `<article class="item" id="n-${it.node.replace(':', '-')}">
      <div class="ihead"><h2>${esc(it.client)}</h2><span class="meta">${esc(r.spec.name ?? it.specId)} · ${w}×${h}</span>${badge}
        <a href="https://www.figma.com/design/${data.figma}/?node-id=${it.node.replace(':', '-')}" target="_blank" rel="noopener">Figma ${esc(it.node)}</a></div>
      <div class="panes">
        ${paneHtml('우리 결과 (빨간 선 = 레퍼런스 글자 상자)', w, h, s, ours + guidesHtml(it, s))}
        ${paneHtml('레퍼런스', w, h, s, refImg)}
        ${paneHtml('겹쳐 보기', w, h, s, refImg + ours, 'ov')}
      </div>
      <div class="dlwrap" data-node="${esc(it.node)}"></div>
      <div class="txt">
        <div><h4>레퍼런스 글자 ${refLines.length}줄</h4><ul>${refLines.map(t => `<li class="${miss.includes(t) ? 'miss' : ''}">${esc(t)}</li>`).join('')}</ul></div>
        <div><h4>우리 결과 글자 ${r.lines.length}줄</h4><ul>${r.lines.map(t => `<li class="${extra.includes(t) ? 'extra' : ''}">${esc(t)}</li>`).join('')}</ul></div>
      </div>
      ${it.note ? `<p class="note">${esc(it.note)}</p>` : ''}
    </article>`;
  }

  async function renderAll() {
    const main = document.getElementById('main');
    const out = [], stats = { items: 0, allText: 0, miss: 0 };
    for (const it of data.items) {
      try {
        const r = await renderItem(it);
        (window.__repro ??= {})[it.node] = { client: it.client, ref: it.ref, name: r.spec.name, w: r.spec.w, h: r.spec.h, html: r.html };   // 시트 내보내기용
        const html = itemHtml(it, r);
        out.push(html);
        stats.items++;
        const missN = (html.match(/class="miss"/g) ?? []).length;
        stats.miss += missN; if (!missN) stats.allText++;
      } catch (e) {
        out.push(`<article class="item"><div class="ihead"><h2>${esc(it.client)}</h2><span class="badge bad">렌더 실패</span></div><pre style="font-size:12px;color:var(--bad)">${esc(e.stack ?? e)}</pre></article>`);
      }
    }
    main.innerHTML = out.join('');
    await new Promise(r => setTimeout(r, 600));   // srcdoc 글꼴·레이아웃이 자리 잡을 시간
    for (const it of data.items) {
      const art = document.getElementById(`n-${it.node.replace(':', '-')}`); if (!art) continue;
      const iframe = art.querySelector('.pane iframe'); const wrap = art.querySelector('.dlwrap');
      if (iframe && wrap) wrap.innerHTML = deltaTable(it, measureLines(iframe));
    }
    document.getElementById('sum').innerHTML = [
      ['레퍼런스', stats.items], ['글자 전부 재현', `${stats.allText}/${stats.items}`], ['빠진 글자 줄', stats.miss],
    ].map(([l, n]) => `<div class="tile"><b>${n}</b>${l}</div>`).join('');
    applyOv();
  }
  const applyOv = () => { const v = document.getElementById('ov').value; document.getElementById('ovv').textContent = v + '%'; document.querySelectorAll('.box.ov').forEach(b => b.style.setProperty('--ov', v / 100)); };
  document.getElementById('ov').addEventListener('input', applyOv);
  document.getElementById('noKv').addEventListener('change', e => { opts.noKv = e.target.checked; renderAll(); });
  document.getElementById('noLogo').addEventListener('change', e => { opts.noLogo = e.target.checked; renderAll(); });
  await renderAll();
  window.__reproDone = true;
</script>
</body>
</html>
