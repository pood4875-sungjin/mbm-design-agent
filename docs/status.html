<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과제 현황판 · Campaign Agent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 문서 글꼴은 카카오 글씨 — 제목·큰 숫자는 큰글씨, 본문은 작은글씨. 굵기는 400·700 두 가지만 쓴다(그 사이 굵기가 없는 글꼴이다).
     자간은 손대지 않는다 — 글꼴이 정한 간격 그대로. 영문 대문자 꼬리표도 쓰지 않는다.
     proposal.html · media-rules.html 과 같은 색 토큰 — 문서들이 한 벌로 보이게.
     색은 역할 토큰으로만 쓴다(design-system-examples.md > 시맨틱 컬러 토큰) — 다크모드는 토큰 교체로 끝난다. */
  :root{
    --ink:#1a1a1a; --sub:#666; --mute:#8a8a86; --line:#e5e5e5; --bg:#fff; --soft:#f7f7f6;
    --accent:#2456d6; --accent-soft:#edf2fd; --accent-line:#c9d8f6;
    --good:#1d7a4f; --good-soft:#e9f5ee; --good-line:#c2e2cf;
    --warn:#96690a; --warn-soft:#fbf3df; --warn-line:#ecd79a;
    --bad:#b3261e; --bad-soft:#fbe9e7; --bad-line:#efc3bf;
    --idle:#d9d9d6;
  }
  @media (prefers-color-scheme:dark){
    :root{ --ink:#ececec; --sub:#a3a3a3; --mute:#7d7d7a; --line:#2e2e2e; --bg:#161616; --soft:#1f1f1f;
      --accent:#7ea2f0; --accent-soft:#1c2942; --accent-line:#2d4570;
      --good:#7ecfa2; --good-soft:#17281d; --good-line:#2c5138;
      --warn:#d9a441; --warn-soft:#2c2412; --warn-line:#5a4a1c;
      --bad:#f08c86; --bad-soft:#301a18; --bad-line:#5a2b28;
      --idle:#3a3a38; }
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Kakao Small Sans","카카오 작은글씨","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
       font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
  /* 스페이싱 8pt 그리드 (design-system-examples.md > 스페이싱 8pt 그리드 + 4pt 보조) */
  .wrap{max-width:1160px;margin:0 auto;padding:40px 24px 96px}
  h1,h2,h3,h4,.big,.mm,.v,.dday .num,.tile b{font-family:"Kakao Big Sans","카카오 큰글씨","Kakao Small Sans","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}
  .eyebrow{font-size:13px;color:var(--sub)}
  h1{font-size:28px;line-height:1.3;font-weight:700;margin:8px 0 8px;}
  .goal{font-size:15px;color:var(--sub)}
  .meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;font-size:12.5px;color:var(--sub)}
  .meta b{color:var(--ink);font-weight:700}
  section{margin-top:40px}
  h2{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h2 small{font-family:"Kakao Small Sans","카카오 작은글씨","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;font-weight:400;font-size:13px;color:var(--sub)}

  /* ─ 상태: 색만으로 구분하지 않는다 — 항상 아이콘 + 글자가 같이 간다 ─ */
  .st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--sub)}
  .st svg{width:14px;height:14px;flex:none}
  .st.done svg{color:var(--good)} .st.doing svg{color:var(--accent)} .st.waiting svg{color:var(--warn)} .st.todo svg{color:var(--mute)}

  /* ─ 과제 개요 ─ 과제 문서 원문 그대로. 무엇을 하는 과제인지, 지금 방식이 어떻게 바뀌는지가 판의 맨 위에 온다 */
  .ov{margin-top:28px}
  .ov .scope{font-size:16px;line-height:1.7;max-width:76ch}
  .ov .sub2{font-size:13.5px;color:var(--sub);margin-top:8px;max-width:76ch;line-height:1.65}
  .shift{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch;margin-top:20px}
  .shift .col{border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .shift .col.to{border:2px solid var(--accent);padding:17px 19px}
  .shift h3,.pair h3{font-size:15px;font-weight:700;margin-bottom:10px}
  .shift .ar{align-self:center;color:var(--mute);font-size:22px}
  .ov ul,.ov ol{padding-left:18px;display:flex;flex-direction:column;gap:7px}
  .ov li{font-size:13.5px;line-height:1.6}
  .ov li b{font-weight:700}
  .pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
  .pair .col{background:var(--soft);border-radius:14px;padding:18px 20px}
  .pair .role{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
  .pair h4{font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:8px}

  /* ─ 지금 ─ 판이 그다음 답해야 하는 것: 어느 단계고, 얼마나 왔나 */
  .now{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:32px}
  .card{border:1px solid var(--line);border-radius:14px;padding:20px 22px;background:var(--bg)}
  .now .stage{background:var(--soft)}
  .now .lbl{font-size:12px;color:var(--sub);font-weight:700}
  .now .big{font-size:26px;font-weight:700;line-height:1.3;margin:6px 0 4px;}
  .now .big span{color:var(--sub);font-weight:400}
  .now p{color:var(--sub);font-size:14px;margin-top:10px;max-width:60ch}
  .counts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px}
  .dday{display:flex;flex-direction:column;justify-content:center}
  .dday .num{font-size:52px;font-weight:700;line-height:1.05;}
  .dday .num small{font-size:18px;font-weight:700;color:var(--sub);margin-left:4px}

  /* ─ 마일스톤 ─ 월마다 한 칸. 막대는 항목 수만큼 칸으로 나눠 상태를 칠한다(칸 사이 2px 틈) */
  .months{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .mo{border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;display:flex;flex-direction:column}
  .mo.cur{border:2px solid var(--accent);padding:15px 15px 11px}
  .mo .top{display:flex;align-items:center;gap:8px}
  .mo .mm{font-size:20px;font-weight:700}
  .pill{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--accent-soft);color:var(--accent)}
  .pill.past{background:var(--soft);color:var(--sub)}
  .mo h3{font-size:14px;font-weight:700;margin:4px 0 12px}
  .seg{display:flex;gap:2px;height:6px;margin-bottom:6px}
  .seg i{flex:1;border-radius:3px;background:var(--idle)}
  .seg i.done{background:var(--good)} .seg i.doing{background:var(--accent)} .seg i.waiting{background:var(--warn)}
  .mo .frac{font-size:12px;color:var(--sub);margin-bottom:10px}
  .mo ul{list-style:none;padding:0;display:flex;flex-direction:column}
  .mo li{padding:10px 0;border-top:1px solid var(--line)}
  .mo li .t{font-size:13.5px;font-weight:700;line-height:1.45;margin-top:4px}
  .mo li .n{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.5}
  .mo li .sr{display:flex;align-items:center;gap:8px}
  .mo li .d{color:var(--mute);font-size:12px;line-height:1}

  /* ─ KPI ─ 미터: 채움이 현재, 트랙은 같은 색의 옅은 단계 */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
  .kpi .id{font-size:12px;font-weight:700;color:var(--sub)}
  .kpi h3{font-size:16px;font-weight:700;margin:2px 0 14px}
  .kpi .row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:end}
  .kpi .v{font-size:32px;font-weight:700;line-height:1.1;}
  .kpi .c{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:2px}
  .kpi .s{font-size:12.5px;color:var(--sub);margin-top:4px}
  .kpi .arrow{color:var(--mute);font-size:20px;padding-bottom:20px}
  .kpi .tgt{text-align:right}
  .meter{height:8px;border-radius:4px;background:var(--accent-soft);margin:14px 0 8px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .kpi .m{font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .note{font-size:12.5px;color:var(--sub);margin-top:10px}

  /* ─ 준비 지표 ─ */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .tile{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--soft)}
  .tile b{display:block;font-size:24px;font-weight:700;line-height:1.15}
  .tile span{font-size:12px;color:var(--sub);display:block;margin-top:2px}
  .tile em{font-style:normal;font-size:11.5px;color:var(--mute);display:block;margin-top:2px}
  .tile.warn{border-color:var(--warn-line);background:var(--warn-soft)}

  /* ─ 기능 5단계 ─ */
  .flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;counter-reset:f}
  .fs{border:1px solid var(--line);border-radius:12px;padding:14px;counter-increment:f}
  .fs .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .fs .h b{font-size:14px}
  .fs .h b::before{content:counter(f) ". ";color:var(--mute);font-weight:700}
  .fs .spec{font-size:12px;color:var(--mute);margin:4px 0 8px}
  .fs .b{font-size:13px;line-height:1.5}
  .fs .g{font-size:12.5px;color:var(--warn);margin-top:6px;line-height:1.5}
  .fs .g::before{content:"남음: ";font-weight:700}

  /* ─ 두 칸 목록 ─ */
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px 32px}
  .list{list-style:none;padding:0}
  .list li{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
  .list li:last-child{border-bottom:1px solid var(--line)}
  .who{font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--soft);color:var(--sub);white-space:nowrap;margin-top:1px}
  .who.me{background:var(--accent-soft);color:var(--accent)}
  .list .t{font-size:13.5px;font-weight:700;line-height:1.5}
  .list .n{font-size:12.5px;color:var(--sub);grid-column:2}
  .num{font-variant-numeric:tabular-nums}
  ol.list{counter-reset:n}
  ol.list li{counter-increment:n}
  ol.list li::before{content:counter(n);font-size:12px;font-weight:700;color:var(--sub);width:22px;height:22px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
  .tag{font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;white-space:nowrap}
  .log li{grid-template-columns:52px minmax(0,1fr)}
  .log .dt{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:1px}
  .log .t{font-weight:400}

  .base{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .base span{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--sub)}
  .base b{color:var(--ink);font-weight:700;margin-left:4px}
  /* ─ 덧붙임 ─ 판의 내용이 아니라 만든 사람의 메모. 상자에 넣지 않고 글로만 둔다 */
  .after{margin-top:64px;max-width:62ch}
  .after p{font-size:15px;line-height:1.8;margin-top:10px}
  .after ul{padding-left:18px;margin-top:10px;display:flex;flex-direction:column;gap:4px}
  .after li{font-size:15px;line-height:1.7}
  .after time{font-size:12.5px;color:var(--mute);display:block;margin-top:14px}
  footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);line-height:1.7}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:720px){
    .wrap{padding:24px 16px 64px} h1{font-size:22px}
    .now{grid-template-columns:minmax(0,1fr)} .now .big{font-size:21px} .dday .num{font-size:40px}
    .shift{grid-template-columns:minmax(0,1fr)} .shift .ar{justify-self:center;transform:rotate(90deg)} .ov .scope{font-size:15px}
    .kpi .v{font-size:26px}
  }
  @media print{ .wrap{padding:0} section{break-inside:avoid} }
</style>
</head>

    </article>`;
  }).join('');

  const kpis = S.kpis.map(k => {
    const pct = Math.round(k.now / k.target * 100);
    return `<article class="card kpi">
      <div class="id">${esc(k.id)}</div><h3>${esc(k.name)}</h3>
      <div class="row">
        <div><div class="c">현재</div><div class="v">${esc(k.nowText)}</div><div class="s">${esc(k.nowNote)}</div></div>
        <div class="arrow" aria-hidden="true">→</div>
        <div class="tgt"><div class="c">목표</div><div class="v">${esc(k.targetText)}</div><div class="s">${esc(k.targetNote)}</div></div>
      </div>
      <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${k.target}" aria-valuenow="${k.now}" aria-label="${esc(k.name)}"><i style="width:${pct}%"></i></div>
      <div class="m"><span class="num">${k.now.toLocaleString()} / ${k.target.toLocaleString()}${esc(k.unit)}</span><span>${esc(k.measure)}</span></div>
    </article>`;
  }).join('');

  const tiles = [
    { v: L.media, l: '규정을 데이터로 옮긴 매체' },
    { v: L.specs, l: '매체 규격', e: `그릴 수 있는 것 ${L.renderable} · 소재 ${L.creatives}종` },
    { v: `${S.measured.lintPass}/${S.measured.lintTotal}`, l: '규격 검사 통과', e: `${S.measured.lintNote} · ${S.measured.lintDate}` },
    { v: S.measured.designExamples, l: '디자인 기준의 근거 소재', e: '실제 고객사 소재 관찰' },
    { v: L.tests ?? '-', l: '자동 점검 통과', e: L.tests ? `코드가 약속대로 도는지 · 실패 ${L.testsFail}` : '이번엔 돌리지 않음' },
    { v: L.needsReview, l: '확인이 필요한 규정', e: '자료에 없어 비워 둔 값', warn: true },
    { v: L.conflicts, l: '자료끼리 충돌', e: '어느 쪽이 맞는지 미정', warn: true },
  ].map(t => `<div class="tile ${t.warn ? 'warn' : ''}"><b>${esc(t.v)}</b><span>${esc(t.l)}</span>${t.e ? `<em>${esc(t.e)}</em>` : ''}</div>`).join('');

  const flow = S.flow.map(f => `<article class="fs"><div class="h"><b>${esc(f.step)}</b>${st(f.status)}</div>
    <div class="spec">${esc(f.spec)}</div><div class="b">${esc(f.built)}</div>${f.gap ? `<div class="g">${esc(f.gap)}</div>` : ''}</article>`).join('');

  const ct = tally(cur.items), at = tally(all);
  document.getElementById('app').innerHTML = `
  <header>
    <div class="eyebrow">${esc(S.task.program)}</div>
    <h1>${esc(S.task.name)}</h1>
    <div class="meta"><span>팀 <b>${esc(S.task.team)}</b></span><span>과제 문서 <b class="num">${esc(S.task.docDate)}</b></span><span>판 기준일 <b class="num">${esc(S.asOf)}</b></span></div>
  </header>

  <section class="ov" aria-labelledby="h-ov">
    <h2 id="h-ov">과제 개요 <small>과제 문서 원문</small></h2>
    <p class="scope">${esc(B.scope)}</p>
    <p class="sub2">${esc(B.priority)}</p>
    <div class="base" aria-label="출발점">${S.baseline.map(b => `<span>${esc(b.label)}<b>${esc(b.value)}</b></span>`).join('')}</div>
    <div class="shift">
      <div class="col"><h3>지금 하는 방식</h3><ol>${B.before.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
      <div class="ar" aria-hidden="true">→</div>
      <div class="col to"><h3>바뀐 뒤의 방식</h3><ol>${B.after.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
    </div>
    <div class="pair">
      <div class="col"><h3>왜 바꾸나</h3><ul>${B.bottleneck.map(t => `<li><b>${esc(t.head)}</b>: ${esc(t.text)}</li>`).join('')}</ul></div>
      <div class="col"><h3>누가 무엇을 맡나</h3><div class="role">
        <div><h4>AI가 수행·지원</h4><ul>${B.ai.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
        <div><h4>사람이 판단·책임</h4><ul>${B.human.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
      </div></div>
    </div>
    <p class="sub2">${esc(B.asset)}</p>
  </section>

  <div class="now">
    <div class="card stage">
      <div class="lbl">지금 단계</div>
      <div class="big">${cur.month}월 <span>·</span> ${esc(cur.title)}</div>
      <div class="counts" aria-label="이번 달 항목">${tallyText(ct)}</div>
      <p>${esc(S.headline)}</p>
    </div>
    <div class="card dday">
      <div class="lbl">11월 이관·베타 시작까지</div>
      <div class="num">${dday > 0 ? dday : 0}<small>일</small></div>
      <div class="counts" aria-label="전체 항목">${tallyText(at)}</div>
      <div class="note">전체 ${all.length}개 항목 기준</div>
    </div>
  </div>

  <section aria-labelledby="h-ms"><h2 id="h-ms">마일스톤 <small>과제 문서의 월별 실행 계획 그대로</small></h2><div class="months">${months}</div></section>

  <section aria-labelledby="h-kpi"><h2 id="h-kpi">KPI <small>실제 처리한 건수로만 센다</small></h2><div class="kpis">${kpis}</div>
    <div class="note">둘 다 아직 0이다. 실제 요청을 처리한 적이 없기 때문이다. 아래 준비 지표는 KPI가 아니다.</div></section>

  <section aria-labelledby="h-ready"><h2 id="h-ready">준비 지표 <small>KPI를 재기 전에 갖춰야 하는 것</small></h2><div class="tiles">${tiles}</div></section>

  <section aria-labelledby="h-flow"><h2 id="h-flow">에이전트 기능 5단계 <small>과제 문서의 사용자 플로우 대비</small></h2><div class="flow">${flow}</div></section>

  <section><div class="two">
    <div><h2>막힌 것 · 필요한 것 <small>누가 풀어야 하나</small></h2>
      <ul class="list">${S.blockers.map(b => `<li><span class="who ${b.who === '나' ? 'me' : ''}">${esc(b.who)}</span><div class="t">${esc(b.text)}</div><div class="n">${esc(b.why)}</div></li>`).join('')}</ul></div>
    <div><h2>다음 할 일 <small>위에서부터</small></h2>
      <ol class="list">${S.next.map(n => `<li><div class="t">${esc(n.text)}<span class="tag">${esc(n.tag)}</span></div></li>`).join('')}</ol></div>
  </div></section>

  <section><div class="two">
    <div><h2>지켜볼 것</h2>
      <ul class="list">${S.watch.map(w => `<li style="grid-template-columns:minmax(0,1fr)"><div class="t">${esc(w.text)}</div><div class="n" style="grid-column:1">${esc(w.detail)}</div></li>`).join('')}</ul></div>
    <div><h2>최근 한 일</h2>
      <ul class="list log">${S.log.map(l => `<li><span class="dt">${esc(l.date)}</span><div class="t">${esc(l.text)}</div></li>`).join('')}</ul></div>
  </div></section>

  ${A ? `<section class="after" aria-labelledby="h-after"><h2 id="h-after">${esc(A.title)}</h2>
    ${A.paras.map(t => `<p>${esc(t)}</p>`).join('')}
    <ul>${A.points.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
    <p>${esc(A.close)}</p><time datetime="${esc(A.date)}">${esc(A.date)}</time></section>` : ''}

  <footer>
    목표·KPI·월별 계획의 출처: ${esc(S.task.docFile)} (작성 ${esc(S.task.docDate)}).
    진행 상태의 출처: 작업 기록과 저장소(커밋 ${L.commits}건, 마지막 ${esc(L.lastCommit)}).
    숫자 중 매체·규격·확인 필요·충돌·테스트는 이 판을 만든 시점(${esc(D.builtAt)})에 저장소에서 다시 센 값이다.<br>
    갱신: <code>node scripts/build-status.mjs</code>. 진행 상태는 <code>docs/status.json</code> 한 곳에서 고친다.
  </footer>`;
})();
</script>
</body>
</html>
