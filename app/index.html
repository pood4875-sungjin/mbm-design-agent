<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBM Design Agent</title>
<style>
  :root{
    --ink:#1a1a1a; --sub:#6b6b6b; --line:#e6e6e4; --bg:#f6f6f4; --panel:#ffffff;
    --accent:#2456d6; --accent-soft:#edf2fd; --accent-line:#c9d8f6;
    --good:#1d7a4f; --good-soft:#e9f5ee; --amber:#b07d10; --amber-soft:#fdf3df;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:14px;padding:0 20px;height:52px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  header .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
  header .logo i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:12px;font-weight:800}
  header .camp{font-size:13px;color:var(--sub)}
  header .spacer{flex:1}
  .stepper{display:flex;gap:4px;font-size:11.5px;color:var(--sub)}
  .stepper span{padding:4px 10px;border-radius:99px}
  .stepper span.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .stepper span.done{color:var(--good)}

  main{flex:1;display:flex;min-height:0}

  /* chat panel */
  #chatPane{width:400px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #chat{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;font-size:13.5px;line-height:1.6;border-radius:14px;padding:10px 14px;white-space:pre-wrap;word-break:keep-all}
  .msg.agent{background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
  .msg.user{background:var(--accent);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .widget{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .widget h4{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:10px;letter-spacing:.04em}
  .widget label{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
  .widget input[type=text],.widget textarea,.widget select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit}
  .widget textarea{min-height:88px;resize:vertical}
  .widget .row{display:flex;gap:8px;align-items:center}
  .widget .chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:6px}
  .widget .chk input{accent-color:var(--accent)}
  .widget .chk.on{border-color:var(--accent-line);background:var(--accent-soft)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{border:none;background:none;color:var(--accent);padding:6px 8px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn-row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
  .swatch{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);padding:0;cursor:pointer}
  .palette{display:flex;gap:8px;align-items:center}
  .kvthumb{width:100%;height:110px;border-radius:8px;background:var(--bg) center/cover no-repeat;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;cursor:pointer}

  /* board */
  #board{flex:1;overflow-y:auto;padding:20px 24px;min-width:0}
  #boardEmpty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);gap:10px}
  #boardEmpty .big{font-size:15px;font-weight:600;color:var(--ink)}
  .ctxbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:none}
  .ctxbar .t{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .ctxbar .fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .ctxbar .f{display:flex;flex-direction:column;gap:4px}
  .ctxbar .f label{font-size:11px;color:var(--sub)}
  .ctxbar .f input{padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;width:150px}
  .ctxbar .note{font-size:12px;color:var(--accent);margin-top:8px;display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card .prev{height:210px;background:#efefed;position:relative;overflow:hidden;flex:none}
  .card .prev iframe{position:absolute;top:0;left:50%;border:0;transform-origin:top left;background:#fff;pointer-events:none}
  .card .meta{padding:10px 12px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
  .card .meta b{font-size:12.5px;flex:1}
  .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px}
  .badge.draft{background:var(--bg);color:var(--sub)}
  .badge.approved{background:var(--good-soft);color:var(--good)}
  .badge.needsReview{background:var(--amber-soft);color:var(--amber)}
  .card .acts{display:flex;gap:2px;padding:0 8px 8px}
  .boardHead{display:none;align-items:center;gap:10px;margin-bottom:14px}
  .boardHead h2{font-size:15px;flex:1}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo"><i>M</i>MBM Design Agent</div>
  <div class="camp" id="campName"></div>
  <div class="spacer"></div>
  <div class="stepper" id="stepper">
    <span data-s="brief">기획 입력</span><span data-s="context">Context</span><span data-s="channels">산출물</span><span data-s="style">그래픽 가이드</span><span data-s="review">생성 · 리뷰</span><span data-s="done">완료</span>
  </div>
</header>
<main>
  <div id="chatPane"><div id="chat"></div></div>
  <div id="board">
    <div id="boardEmpty">
      <div class="big">산출물 보드</div>
      <div>왼쪽 대화에서 캠페인을 시작하면 생성 결과가 여기에 나타납니다</div>
    </div>
    <div class="boardHead" id="boardHead">
      <h2 id="boardTitle"></h2>
      <button class="btn pri" id="approveAll">전체 승인</button>
    </div>
    <div class="ctxbar" id="ctxbar">
      <div class="t">CAMPAIGN CONTEXT <span style="font-weight:400">— 값을 바꾸고 일괄 반영하면 전 산출물이 갱신됩니다</span></div>
      <div class="fields" id="ctxFields"></div>
      <div class="note" id="propNote"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
