<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBM Design Agent</title>
<style>
  :root{
    --ink:#1f1f1f; --sub:#6f6f6f; --line:#e6e6e4; --panel:#ffffff; --soft:#f1f3f4;
    --accent:#2456d6; --accent-soft:#edf2fd; --accent-line:#c9d8f6;
    --good:#1d7a4f; --good-soft:#e9f5ee; --amber:#b07d10; --amber-soft:#fdf3df;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 28px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);
    background:#fbfbfa;
    background-image:radial-gradient(#dcdcda 1px, transparent 1px);
    background-size:18px 18px;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}

  /* ─ header ─ */
  header{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;z-index:20}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;cursor:pointer}
  .logo i{width:24px;height:24px;border-radius:7px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:12px;font-weight:800}
  .beta{font-size:10.5px;font-weight:700;border:1.5px solid var(--ink);border-radius:99px;padding:2px 8px}
  #campPill{display:none;font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:7px 16px;box-shadow:var(--shadow)}
  .spacer{flex:1}
  .hbtn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
  .hbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ─ home ─ */
  #home{position:absolute;inset:56px 0 0 0;display:flex}
  #sidebar{width:300px;flex:none;margin:8px 0 16px 16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  #sidebar .search{margin:14px 14px 8px;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:99px;padding:9px 14px}
  #sidebar .search input{border:0;background:none;outline:0;font-size:13px;flex:1}
  #sidebar .qchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 6px}
  #sidebar .qchips span{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 9px;font-weight:600}
  #sidebar .grp{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.05em;padding:12px 18px 6px}
  #campList{flex:1;overflow-y:auto;padding:0 8px 12px}
  .citem{display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer}
  .citem:hover{background:var(--soft)}
  .citem .thumb{width:40px;height:40px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
  .citem b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .citem span{font-size:11.5px;color:var(--sub)}
  .citem .m{min-width:0;flex:1}
  #campEmpty{font-size:12.5px;color:var(--sub);padding:10px 18px;line-height:1.6}

  #hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;min-width:0}
  #hero h1{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.01em;margin-bottom:26px;text-align:center}
  .inputCard{width:min(760px,100%);background:var(--soft);border-radius:24px;padding:20px 20px 14px;box-shadow:var(--shadow)}
  .inputCard textarea{width:100%;min-height:96px;border:0;background:none;outline:0;resize:none;font-size:15px;line-height:1.65}
  .inputCard .bar{display:flex;align-items:center;gap:8px;margin-top:6px}
  .iconb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:16px;display:inline-flex;align-items:center;justify-content:center}
  .chip{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--sub)}
  .sendb{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:800;margin-left:auto}
  .sendb:disabled{opacity:.35}
  #samples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px}
  #samples button{font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 15px;color:var(--sub);box-shadow:var(--shadow)}

  /* ─ work ─ */
  #work{position:absolute;inset:56px 0 0 0;display:none}
  #chatCard{position:absolute;left:16px;top:8px;bottom:96px;width:330px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:10}
  #chatCard .head{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:92%;font-size:13px;line-height:1.6;border-radius:13px;padding:9px 13px;white-space:pre-wrap;word-break:keep-all}
  .msg.agent{background:var(--soft);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .widget{align-self:stretch;border:1px solid var(--line);border-radius:13px;padding:13px}
  .widget h4{font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:9px;letter-spacing:.04em}
  .widget label{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
  .widget input[type=text]{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .widget .chk{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;cursor:pointer;margin-bottom:6px}
  .widget .chk input{accent-color:var(--accent)}
  .widget .chk.on{border-color:var(--accent-line);background:var(--accent-soft)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:600}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{border:none;background:none;color:var(--accent);padding:5px 7px;border-radius:8px}
  .btn-row{display:flex;gap:8px;margin-top:11px;justify-content:flex-end}
  .kvthumb{width:100%;height:96px;border-radius:9px;background:var(--soft) center/cover no-repeat;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;cursor:pointer}
  .palette{display:flex;gap:8px;align-items:center}
  .swatch{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);padding:0;cursor:pointer}
  .widget select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px}

  #canvas{position:absolute;left:366px;right:300px;top:8px;bottom:96px;overflow-y:auto;padding:8px 4px 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .card .prev{height:195px;background:#eeeeec;position:relative;overflow:hidden}
  .card .prev iframe{position:absolute;top:0;left:50%;border:0;transform-origin:top center;background:#fff;pointer-events:none}
  .card .meta{padding:9px 12px 2px;display:flex;align-items:center;gap:8px}
  .card .meta b{font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;flex:none}
  .badge.draft{background:var(--soft);color:var(--sub)}
  .badge.approved{background:var(--good-soft);color:var(--good)}
  .badge.needsReview{background:var(--amber-soft);color:var(--amber)}
  .card .acts{display:flex;gap:1px;padding:2px 7px 7px;flex-wrap:wrap}
  .card .acts .btn.ghost{font-size:11.5px}

  #stylePanel{position:absolute;right:16px;top:8px;bottom:96px;width:268px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow-y:auto;padding:16px;display:none;z-index:10}
  #stylePanel h3{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.05em;margin-bottom:12px}
  #stylePanel .sec{margin-bottom:18px}
  #stylePanel label{display:block;font-size:11.5px;color:var(--sub);margin:9px 0 4px}
  #stylePanel input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  #stylePanel select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  #propNote{font-size:11.5px;color:var(--accent);margin-top:8px;display:none;line-height:1.5}

  #cmdBar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(640px,56%);background:var(--panel);border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow);display:none;align-items:center;gap:8px;padding:7px 8px 7px 20px;z-index:11}
  #cmdBar input{flex:1;border:0;outline:0;background:none;font-size:14px}

  /* ─ modal ─ */
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:40}
  #modal{width:min(420px,92vw);background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:22px}
  #modal h3{font-size:15px;margin-bottom:4px}
  #modal p{font-size:12.5px;color:var(--sub);margin-bottom:12px;line-height:1.55}
  #modal label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  #modal input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px}
  #modalBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo" id="homeBtn"><i>M</i>MBM Design Agent <span class="beta">PILOT</span></div>
  <div id="campPill"></div>
  <div class="spacer"></div>
  <button class="hbtn" id="keyBtn">AI 키</button>
  <button class="hbtn pri" id="approveAll" style="display:none">전체 승인</button>
</header>

<div id="home">
  <aside id="sidebar">
    <div class="search"><span>🔍</span><input id="searchIn" placeholder="자산 검색 — 예: 작년 서울 배너"></div>
    <div class="qchips" id="qchips"></div>
    <div class="grp">내 캠페인</div>
    <div id="campList"></div>
    <div id="campEmpty">승인 완료한 캠페인이 여기에 쌓입니다.<br>과거 자산 재사용의 진입점입니다.</div>
  </aside>
  <section id="hero">
    <h1>어떤 캠페인을 시작할까요?</h1>
    <div class="inputCard">
      <textarea id="briefText" placeholder="기획 내용을 자유롭게 적어주세요 — 일정, 장소, 대상, 필요한 산출물..."></textarea>
      <div class="bar">
        <button class="iconb" id="fileBtn" title="PPT·워드 첨부 — txt는 즉시, 그 외는 서버 연동 후">＋</button>
        <input type="file" id="fileIn" accept=".txt,.md" style="display:none">
        <span class="chip" id="aiChip">AI 해석: 꺼짐</span>
        <button class="sendb" id="briefGo" title="시작">↑</button>
      </div>
    </div>
    <div id="samples"></div>
  </section>
</div>

<div id="work">
  <div id="chatCard">
    <div class="head">에이전트 <span class="spacer"></span><span id="stepLabel" style="font-weight:400"></span></div>
    <div id="chat"></div>
  </div>
  <div id="canvas"><div class="grid" id="grid"></div></div>
  <aside id="stylePanel">
    <h3>CAMPAIGN</h3>
    <div class="sec" id="ctxFields"></div>
    <h3>STYLE</h3>
    <div class="sec">
      <label>컬러 (메인 · 배경)</label>
      <div class="palette">
        <input type="color" class="swatch" id="pColor1">
        <input type="color" class="swatch" id="pColor2">
      </div>
      <label>폰트</label>
      <select id="pFont"><option>Pretendard</option><option>Noto Sans KR</option><option>Apple SD Gothic Neo</option></select>
    </div>
    <button class="btn pri" id="propBtn" style="width:100%">일괄 반영</button>
    <div id="propNote"></div>
  </aside>
  <div id="cmdBar">
    <input id="cmdIn" placeholder="무엇을 변경할까요? — 예: 장소 킨텍스로 변경">
    <button class="sendb" id="cmdGo">↑</button>
  </div>
</div>

<div id="overlay">
  <div id="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
    <div id="modalBody"></div>
    <div id="modalBtns"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
