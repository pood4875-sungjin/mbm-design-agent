<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"></head><body>
<script type="module">
// 「생성 직후 차단 0건」 전수 — 앱과 같은 코드(render → measureArtifact → lintArtifact → 틀 가이드 → approvalGate)를 브라우저에서 돌린다. scripts/self-block.mjs 가 띄운다.
import { renderArtifact } from '/core/contract.js';
import { familiesFor, familyStyle, familyById, frameFor } from '/core/recipes.js';
import { templateQuality, measureTemplateDoc } from '/core/tplquality.js';
import { TEMPLATE_NORMS } from '/core/template-norms.js';
import { registerAll } from '/core/generate.js';
import { createContext } from '/core/context.js';
import { normalizeStyle } from '/core/style.js';
import { adSpecGroups } from '/core/adspecs.js';
import { lintArtifact } from '/core/lint.js';
import { approvalGate } from '/core/gate.js';
import { measureArtifact } from '/app/measure.js';
import { checkAdDoc } from '/core/adcheck.js';
import { renderFit } from '/app/adfit.js';
import { kvGrid, measureGuideDoc } from '/core/guidemeasure.js';
import { RULES, rulesetOf, guideContext, evaluate, MOLD_BLOCK_MEDIA } from '/core/guidecheck.js';
import { guideFor } from '/core/canon.js';
import { shapeOf } from '/core/layouts.js';
import { kvTypeOf } from '/core/kvtypes.js';
import { fontIds, isBundledFont, localFaceCss } from '/core/fonts.js';
registerAll();
const FACES = fontIds().filter(isBundledFont).map(id => localFaceCss(id)).join('');
document.head.insertAdjacentHTML('beforeend', `<style id="bundledFonts">${FACES}</style>`);
const post = (p, b) => fetch(p, { method: 'POST', body: JSON.stringify(b) });
const toData = async u => { if (!u) return null; const b = await (await fetch(u)).blob(); return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); };
const job = await (await fetch('/job')).json();
const groups = adSpecGroups().filter(g => g.entry.extract && (!job.specs || job.specs.includes(g.id)));
for (const c of job.cases) {
  const kv = await toData(c.kvUrl), logo = await toData(c.logoUrl);
  const style = normalizeStyle({ keyVisual: kv, kvMeta: c.meta, logo, logoLight: c.tone === 'light' ? logo : null, logoTone: c.tone, logoMeta: c.logoMeta, colors: c.colors, mode: 'light', fonts: { heading: 'KakaoBigSans', body: 'KakaoBigSans' }, background: { mode: 'auto', color: null }, kvUse: 'auto', mood: [] });
  const G = await kvGrid(kv).catch(() => null);
  for (const b of job.briefs) {
    const ctx = createContext(b.fields, 'recruit');
    for (const g of groups) for (const rst of (job.recipes ? familiesFor(g.entry, c.meta, true, b.id, { all: true }).map(familyStyle) : [null])) {
      const spec = g.entry, row = { case: c.id, brief: b.id, spec: g.id, medium: spec.medium, grade: spec.grade ?? null, recipe: rst?.tpl ?? null };
      try {
        if (spec.asset || spec.rules?.asset) { row.skip = 'asset'; await post('/row', row); continue; }
        const html = renderArtifact(g.id, ctx, rst ? { ...style, ...rst } : style, {});
        if (rst) { const ov = /&quot;overlap&quot;:([\d.]+)/.exec(html); if ((ov && +ov[1] >= 0.08) || /&quot;unfit&quot;:true/.test(html)) { row.skip = 'overlap'; await post('/row', row); continue; } }
        const m = await measureArtifact(html, spec);
        let lint = lintArtifact({ spec: spec.rules, medium: spec.mediumRules, measure: m, ctx });
        if (lint.issues.some(i => i.code === 'weight')) { try { const fit = await renderFit(ctx, rst ? { ...style, ...rst } : style, spec, h => h); if (fit.fitted && !fit.lint.issues.some(i => i.code === 'weight')) { lint = fit.lint; row.fit = fit.fitted.label; } } catch (e) { row.fitErr = String(e.message); } }
        // 틀 가이드(자소설) · 디자인 검수 — 앱과 같은 iframe 측정
        const ifr = document.createElement('iframe'); ifr.style.cssText = `position:fixed;left:-30000px;top:0;width:${spec.w}px;height:${spec.h}px;border:0`;
        ifr.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>html,body{margin:0}${FACES}</style></head><body>${html}</body></html>`;
        await new Promise(r => { ifr.onload = r; document.body.appendChild(ifr); });
        const doc = ifr.contentDocument; try { await doc.fonts?.ready; } catch {}
        let guide = null;
        const needsGuide = !!spec.rules?.safeArea?.measuredFromTemplate?.mold && MOLD_BLOCK_MEDIA.has(spec.medium);
        if (needsGuide) {
          const gm = measureGuideDoc(doc, { kvMeta: c.meta, G });
          if (gm.error) guide = { error: gm.error, rows: [] };
          else guide = { rows: evaluate(guideContext({ spec, trace: gm.trace, m: gm, meta: c.meta, kt: kvTypeOf(c.meta), guide: guideFor(spec.mediumRules ?? {}), shape: shapeOf(spec.w, spec.h), logoMeta: c.logoMeta, primary: style.palette?.primary ?? null, kind: 'recruit', hasDate: !!ctx.core?.deadline }), rulesetOf ? RULES : RULES) };
        }
        if (rst) { try { const d = measureTemplateDoc(doc), tr = JSON.parse(doc.querySelector('[data-ad]').dataset.trace); row.quality = templateQuality(d.rects, { W: d.W, H: d.H, frame: frameFor(familyById(rst.tpl), spec), sx: tr.tpl.sx, sy: tr.tpl.sy, sf: tr.tpl.sf, logo: d.logo, align: tr.tpl.align, safeL: +spec.rules?.safeArea?.left || 0, norm: TEMPLATE_NORMS[g.id] ?? null }); row.frame = tr.tpl.frame; } catch (e) { row.quality = { ok: false, fails: [{ code: 'quality-error', msg: String(e.message).slice(0, 80) }], m: {} }; } }
        const samples = doc.querySelectorAll('[data-sample]').length;
        let design; try { design = checkAdDoc(doc, { kvMeta: c.meta }) ?? { warnings: [] }; } catch (e) { design = { warnings: [{ code: 'design-failed', msg: String(e.message) }] }; }
        const gate = approvalGate({ grade: spec.grade ?? null, lint, design, samples, guide, needsGuide });
        row.design = (design.warnings ?? []).map(w => ({ code: w.code, level: w.level, msg: w.msg }));
        ifr.remove();
        row.state = gate.state; row.reasons = gate.reasons; row.samples = samples; row.bytes = m.bytes;
        row.issues = lint.issues.map(i => ({ level: i.level, code: i.code, role: i.role ?? null, msg: i.msg }));
        row.moldFails = (guide?.rows ?? []).filter(r => r.level === 'block' && r.ok === false).map(r => ({ id: r.id, actual: r.actual }));
        row.texts = m.texts.map(t => ({ role: t.role, text: t.text, lines: t.lines, fontPx: t.fontPx }));
      } catch (e) { row.state = 'error'; row.err = String(e.message ?? e).slice(0, 200); }
      await post('/row', row);
    }
  }
}
await post('/done', {});
</script></body></html>
